<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>At Your Service</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; font-family: -apple-system, "SF Pro Text", Helvetica, sans-serif; cursor: none; }

  /* ---- left: Terminal.app ---- */
  #term {
    width: 50%; height: 100%; background: #1e1e1e; color: #d9d9d9;
    font: 15px/1.5 "SF Mono", Menlo, monospace; padding: 14px 18px;
    overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    white-space: pre-wrap; word-break: break-word;
  }
  #term .p { color: #d9d9d9; }
  #term .p::before { content: "atlas@service ~ % "; color: #8f8f8f; }
  #term .a { color: #d9d9d9; }
  #term .a b { color: #8f8f8f; font-weight: normal; }
  #term .err { color: #e06c75; }
  #cur { display: inline-block; width: 8px; height: 17px; background: #d9d9d9; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- right: the app ---- */
  #app { width: 50%; height: 100%; background: #fff; color: #1d1d1f; padding: 72px 80px; overflow: hidden; }
  #app { display: flex; flex-direction: column; }
  #app h1 { font-size: clamp(22px, 4.2vh, 36px); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 2.5vh; min-height: 1.2em; }
  #app ul { list-style: none; }
  #app ul { flex: 1; min-height: 0; }
  #app li { display: flex; align-items: center; gap: .8em; padding: 1.1vh 0; border-bottom: 1px solid #eee; font-size: clamp(13px, 2.1vh, 19px); line-height: 1.25; transition: color .4s; }
  #app li span.c { width: 1.2em; height: 1.2em; border: 1.5px solid #c7c7cc; border-radius: 50%; flex: none; transition: all .3s; }
  #app li.done span.c { background: #1d1d1f; border-color: #1d1d1f; }
  #app li.done { color: #a1a1a6; text-decoration: line-through; }
  #app li.last { margin-top: 1.5vh; border-bottom: 0; }

  /* per-sprint look, set from data-* on #app */
  #app[data-font="serif"] { font-family: "New York", Georgia, serif; }
  #app[data-font="mono"]  { font-family: "SF Mono", Menlo, monospace; }
  #app[data-font="mono"] h1 { letter-spacing: 0; font-weight: 600; }
  #app[data-box="square"] li span.c { border-radius: 4px; }
  #app[data-box="none"] li span.c { display: none; }
  #app[data-box="none"] li.done { text-decoration: none; opacity: .35; }
  #app[data-align="center"] { text-align: center; }
  #app[data-align="center"] li { justify-content: center; }
  #app[data-dense="1"] li { padding: .6vh 0; font-size: clamp(12px, 1.9vh, 17px); border-bottom: 0; }
  #app[data-dense="1"] h1 { font-size: clamp(18px, 3.4vh, 28px); }
  #app[data-rule="0"] li { border-bottom: 0; }
  #app[data-tint="1"] { background: var(--bg); }
  #app[data-caps="1"] h1 { text-transform: uppercase; letter-spacing: .08em; font-size: clamp(14px, 2.8vh, 24px); }
  #app[data-big="1"] li { font-size: clamp(14px, 2.6vh, 25px); padding: 1.4vh 0; }
  #app[data-big="1"] h1 { font-size: clamp(26px, 5.5vh, 50px); }
  #app li.done span.c { background: var(--ac); border-color: var(--ac); }

  /* phones and portrait: app on top, terminal on the bottom */
  @media (max-width: 760px), (orientation: portrait) {
    body { flex-direction: column-reverse; cursor: auto; }
    #term, #app { width: 100%; height: 50%; height: 50dvh; }
    #term { font-size: calc(var(--h) * .036); padding: 12px 14px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    #cur { height: 14px; }
    #app { padding: calc(var(--h) * .06) 24px calc(var(--h) * .04); padding-top: calc(var(--h) * .06 + env(safe-area-inset-top)); }
    #app h1 { font-size: calc(var(--h) * .082); margin-bottom: calc(var(--h) * .02); }
    #app li { font-size: calc(var(--h) * .05); padding: calc(var(--h) * .012) 0; }
    #app li.last { margin-top: calc(var(--h) * .015); }
    #app[data-dense="1"] li { font-size: calc(var(--h) * .046); padding: calc(var(--h) * .008) 0; }
    #app[data-dense="1"] h1 { font-size: calc(var(--h) * .068); }
    #app[data-big="1"] li { font-size: calc(var(--h) * .056); padding: calc(var(--h) * .014) 0; }
    #app[data-big="1"] h1 { font-size: calc(var(--h) * .1); }
    #app[data-caps="1"] h1 { font-size: calc(var(--h) * .056); }
  }
</style>
</head>
<body>
  <div id="term"><div id="lines"></div><div class="p"><span id="cur"></span></div></div>
  <div id="app"><h1 id="title"></h1><ul id="list"></ul></div>

<script>
  const lines = document.getElementById("lines");
  const title = document.getElementById("title");
  const list  = document.getElementById("list");

  function addLine(s) {
    const d = document.createElement("div");
    if (s.startsWith("$ ")) { d.className = "p"; d.textContent = s.slice(2); }
    else if (s.startsWith("! ")) { d.className = "err"; d.textContent = s.slice(2); }
    else { d.className = "a"; const m = s.match(/^\[(\w+)\] (.*)$/);
      if (m) { const b = document.createElement("b"); b.textContent = m[1] + "  "; d.append(b, m[2]); } else d.textContent = s; }
    lines.append(d);
    while (lines.children.length > 60) lines.firstChild.remove();
  }

  const app = document.getElementById("app");
  // size type from the pane itself, not the window
  const fit = () => document.body.style.setProperty("--h", app.clientHeight + "px");
  new ResizeObserver(fit).observe(app); fit();
  function look(s) {
    if (!s) return;
    for (const k in s) app.dataset[k] = s[k];
    app.style.setProperty("--ac", s.ac);
    app.style.setProperty("--bg", s.bg);
  }

  function render(app, items) {
    title.textContent = app || "";
    list.innerHTML = "";
    items.forEach((it, i) => {
      const li = document.createElement("li");
      li.className = (it.done ? "done " : "") + (i === items.length - 1 ? "last" : "");
      li.innerHTML = `<span class="c"></span><span>${it.t}</span>`;
      list.append(li);
    });
  }

  const es = new EventSource("/events");
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "init")  { ev.log.forEach(addLine); look(ev.look); render(ev.app, ev.items); }
    if (ev.type === "log")   addLine(ev.line);
    if (ev.type === "reset") render("", []);
    if (ev.type === "items") { look(ev.look); render(ev.app, ev.items); }
    if (ev.type === "done")  list.children[ev.i]?.classList.add("done");
    if (ev.type === "undone") list.children[ev.i]?.classList.remove("done");
  };
</script>
</body>
</html>
