<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>At Your Service</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; font-family: -apple-system, "SF Pro Text", Helvetica, sans-serif; cursor: none; }

  /* ---- left: Terminal.app ---- */
  #term {
    width: 50%; height: 100%; background: #1e1e1e; color: #d9d9d9;
    font: 15px/1.5 "SF Mono", Menlo, monospace; padding: 14px 18px;
    overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    white-space: pre-wrap; word-break: break-word;
  }
  #term .p { color: #d9d9d9; }
  #term .p::before { content: "atlas@service ~ % "; color: #8f8f8f; }
  #term .a { color: #d9d9d9; }
  #term .a b { color: #8f8f8f; font-weight: normal; }
  #term .err { color: #e06c75; }
  #cur { display: inline-block; width: 8px; height: 17px; background: #d9d9d9; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- right: the app ---- */
  #app { width: 50%; height: 100%; background: #fff; color: #1d1d1f; padding: 72px 80px; overflow: hidden; }
  #app h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 28px; min-height: 42px; }
  #app ul { list-style: none; }
  #app li { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid #eee; font-size: 18px; transition: color .4s; }
  #app li span.c { width: 22px; height: 22px; border: 1.5px solid #c7c7cc; border-radius: 50%; flex: none; transition: all .3s; }
  #app li.done span.c { background: #1d1d1f; border-color: #1d1d1f; }
  #app li.done { color: #a1a1a6; text-decoration: line-through; }
  #app li.last { margin-top: 18px; border-bottom: 0; }

  /* per-sprint look, set from data-* on #app */
  #app[data-font="serif"] { font-family: "New York", Georgia, serif; }
  #app[data-font="mono"]  { font-family: "SF Mono", Menlo, monospace; }
  #app[data-font="mono"] h1 { letter-spacing: 0; font-weight: 600; }
  #app[data-box="square"] li span.c { border-radius: 4px; }
  #app[data-box="none"] li span.c { display: none; }
  #app[data-box="none"] li.done { text-decoration: none; opacity: .35; }
  #app[data-align="center"] { text-align: center; }
  #app[data-align="center"] li { justify-content: center; }
  #app[data-dense="1"] li { padding: 6px 0; font-size: 16px; border-bottom: 0; }
  #app[data-dense="1"] h1 { font-size: 26px; }
  #app[data-rule="0"] li { border-bottom: 0; }
  #app[data-tint="1"] { background: var(--bg); }
  #app[data-caps="1"] h1 { text-transform: uppercase; letter-spacing: .08em; font-size: 22px; }
  #app[data-big="1"] li { font-size: 24px; padding: 16px 0; }
  #app[data-big="1"] h1 { font-size: 48px; }
  #app li.done span.c { background: var(--ac); border-color: var(--ac); }

  /* phones and portrait: app on top, terminal on the bottom */
  @media (max-width: 760px), (orientation: portrait) {
    body { flex-direction: column-reverse; cursor: auto; }
    #term, #app { width: 100%; height: 50%; height: 50dvh; }
    #term { font-size: 12px; padding: 12px 14px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    #cur { height: 14px; }
    #app { padding: 40px 24px 20px; padding-top: calc(28px + env(safe-area-inset-top)); }
    #app h1 { font-size: 26px; margin-bottom: 14px; min-height: 32px; }
    #app li { font-size: 16px; padding: 8px 0; gap: 12px; }
    #app li span.c { width: 19px; height: 19px; }
    #app li.last { margin-top: 10px; }
    #app[data-big="1"] li { font-size: 19px; padding: 10px 0; }
    #app[data-big="1"] h1 { font-size: 34px; }
    #app[data-caps="1"] h1 { font-size: 18px; }
  }
</style>
</head>
<body>
  <div id="term"><div id="lines"></div><div class="p"><span id="cur"></span></div></div>
  <div id="app"><h1 id="title"></h1><ul id="list"></ul></div>

<script>
  const lines = document.getElementById("lines");
  const title = document.getElementById("title");
  const list  = document.getElementById("list");

  function addLine(s) {
    const d = document.createElement("div");
    if (s.startsWith("$ ")) { d.className = "p"; d.textContent = s.slice(2); }
    else if (s.startsWith("! ")) { d.className = "err"; d.textContent = s.slice(2); }
    else { d.className = "a"; const m = s.match(/^\[(\w+)\] (.*)$/);
      if (m) { const b = document.createElement("b"); b.textContent = m[1] + "  "; d.append(b, m[2]); } else d.textContent = s; }
    lines.append(d);
    while (lines.children.length > 60) lines.firstChild.remove();
  }

  const app = document.getElementById("app");
  function look(s) {
    if (!s) return;
    for (const k in s) app.dataset[k] = s[k];
    app.style.setProperty("--ac", s.ac);
    app.style.setProperty("--bg", s.bg);
  }

  function render(app, items) {
    title.textContent = app || "";
    list.innerHTML = "";
    items.forEach((it, i) => {
      const li = document.createElement("li");
      li.className = (it.done ? "done " : "") + (i === items.length - 1 ? "last" : "");
      li.innerHTML = `<span class="c"></span><span>${it.t}</span>`;
      list.append(li);
    });
  }

  const es = new EventSource("/events");
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === "init")  { ev.log.forEach(addLine); look(ev.look); render(ev.app, ev.items); }
    if (ev.type === "log")   addLine(ev.line);
    if (ev.type === "reset") render("", []);
    if (ev.type === "items") { look(ev.look); render(ev.app, ev.items); }
    if (ev.type === "done")  list.children[ev.i]?.classList.add("done");
    if (ev.type === "undone") list.children[ev.i]?.classList.remove("done");
  };
</script>

<script>
  es.close();
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const seen = [];
  const roll = () => { let r; do { r = { font: pick(["sans","serif","mono"]), box: pick(["circle","square","none"]), align: pick(["left","center"]),
    dense: pick(["0","1"]), rule: pick(["1","0"]), tint: pick(["0","1"]), caps: pick(["0","0","1"]), big: pick(["0","0","1"]),
    ac: pick(["#1d1d1f","#0a84ff","#ff453a","#30d158","#bf5af2","#ff9f0a"]), bg: pick(["#fafafa","#f5f5f0","#f2f6fb","#fbf5ef","#f4f4f8"]) };
    } while (seen.includes(JSON.stringify(r))); seen.push(JSON.stringify(r)); return r; };
  const NAMES = ["Ledger","Tally","Slate","Quill","Dock","Marks"];
  const tasks = ["Write the brief","Choose the look","Write the store","Build the list","Test it","Ship it","Rebuild this to-do app"];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const done = (i, on=true) => list.children[i].classList.toggle("done", on);
  (async () => { for (let n = 1;; n++) {
    const name = NAMES[(n-1) % NAMES.length];
    render("", []); addLine("$ sprint " + n); await wait(1500);
    look({font:"sans",box:"circle",align:"left",dense:"0",rule:"1",tint:"0",caps:"0",big:"0",ac:"#1d1d1f",bg:"#fafafa"});
    render(name, tasks.map(t => ({t, done:false})));
    addLine(`[atlas] ${name}. one list, nothing else. @iris pick the look`); done(0); await wait(2500);
    const r = roll(); addLine(`[iris] @atlas "nothing else" noted. ${Object.entries(r).map(([k,v])=>k+"="+v).join(" ")}`); addLine(`[iris] @grond store is yours`); look(r); done(1); await wait(2500);
    addLine(`[grond] @iris ${r.box==="none"?"no checkbox, so toggle is a tap on the row":"checkbox toggles done"}. store: add, toggle, remove`); addLine(`[grond] @lumen three functions, all sync`); done(2); await wait(2500);
    addLine(`[lumen] @grond wired. list renders from store on every change`); addLine(`[lumen] @sieve over to you`); done(3); await wait(2500);
    if (n % 2 === 0) {
      addLine(`[sieve] @lumen FAIL. done items still sort to top`); done(4); await wait(2500);
      done(3,false); addLine(`[lumen] @sieve fixed, done items sink. back to you`); done(3); await wait(2500);
      addLine(`[sieve] @lumen PASS. @helm ship it`); done(4); await wait(2500);
    } else { addLine(`[sieve] @lumen PASS, 12 cases. @helm ship it`); done(4); await wait(2500); }
    addLine(`[helm] @sieve shipping. ${name.toLowerCase()}.local is live`); done(5); await wait(2500);
    addLine("$ ship " + name); await wait(4000);
  }})();
</script>
</body>
</html>
